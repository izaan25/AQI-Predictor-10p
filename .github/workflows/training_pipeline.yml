name: Training Pipeline — Daily

on:
  schedule:
    - cron: "0 2 * * *"   # 02:00 UTC daily
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - name: Train models
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT: ${{ secrets.HOPSWORKS_PROJECT }}
          TARGET_CITY:       ${{ vars.TARGET_CITY || 'karachi' }}
          STORAGE_MODE:      hopsworks
        run: python -m training_pipeline.train
      - uses: actions/upload-artifact@v4
        with:
          name: trained-models-${{ github.run_number }}
          path: models/latest/
          retention-days: 30
