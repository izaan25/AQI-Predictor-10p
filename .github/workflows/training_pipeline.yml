name: Training Pipeline — Daily

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install requests loguru scikit-learn xgboost joblib pandas numpy python-dotenv plotly

      - name: Backfill training data
        env:
          AQICN_TOKEN: ${{ secrets.AQICN_TOKEN }}
          OW_API_KEY:  ${{ secrets.OW_API_KEY }}
          TARGET_CITY: ${{ vars.TARGET_CITY || 'karachi' }}
          STORAGE_MODE: local
        run: python -m feature_pipeline.backfill --days 365

      - name: Train models
        env:
          TARGET_CITY:  ${{ vars.TARGET_CITY || 'karachi' }}
          STORAGE_MODE: local
        run: python -m training_pipeline.train

      - uses: actions/upload-artifact@v4
        with:
          name: trained-models-${{ github.run_number }}
          path: models/latest/
          retention-days: 30
